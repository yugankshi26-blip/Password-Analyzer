<div class="page" [class.dark]="darkMode">
  <div class="blob-3"></div>
  <div class="page-bg-accent"></div>
  <div class="page-bg-extra"></div>
  <div class="card">

    <div class="top-bar">
      <h2>Password Security Analyzer</h2>
      <button class="dark-btn" (click)="darkMode = !darkMode">
        {{ darkMode ? '☀️' : '🌙' }}
      </button>
    </div>

    <!-- Password -->
    <div class="input-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        (input)="checkStrength()"
        placeholder="Enter password"
      />
      <span class="toggle" (click)="showPassword = !showPassword">
        {{ showPassword ? '🙈' : '👁️' }}
      </span>
      <span class="hint">ℹ Use uppercase, number & special character</span>
    </div>

    <!-- Confirm Password -->
    <div class="input-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        placeholder="Confirm password"
      />
    </div>

    <!-- Strength bar -->
   
    <!-- Strength text -->
    <div class="result" [ngClass]="strengthClass">
       {{ strengthText }}
    </div>

    <!-- Checklist -->
    <ul>
      <li [class.ok]="hasMinLength">Minimum 8 characters</li>
      <li [class.ok]="hasUppercase">At least one uppercase letter</li>
      <li [class.ok]="hasNumber">At least one number</li>
      <li [class.ok]="hasSpecial">At least one special character</li>
      <li [class.ok]="password === confirmPassword && password">
        Passwords match
      </li>
    </ul>

  </div>
</div>
